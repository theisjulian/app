<style>

    + '}';
  window._opChanged = () => {
    dirty = true; setStat('wait', 'Änderung wird gesichert …');
    clearTimeout(saveT); saveT = setTimeout(async () => { try { await persist(); } catch (e) {} schedulePush(); }, 700);
  };
  const SRC = {};
  async function load(name) { if (!SRC[name]) SRC[name] = await (await fetch(name, { cache: 'no-cache' })).text(); return SRC[name]; }
  const base = () => '<base href="' + location.href.replace(/[^/]*$/, '') + '">';
  async function startO() { window._opData = store.data; const h = await load('orario.html'); $('fO').srcdoc = h.replace('<head>', '<head>' + base() + '<script>(' + shim.toString() + ')(true);<' + '/script>'); }
  async function startG() { window._opData = store.data;
    try { const g = store.data.gb_tool && store.data.gb_tool.v ? JSON.parse(store.data.gb_tool.v) : {}; if (store.data.orario_v1 && store.data.orario_v1.v && !(g.plan && g.plan.on)) { g.plan = Object.assign({}, g.plan, { on: true }); store.data.gb_tool = { v: JSON.stringify(g), t: Date.now() }; } } catch (e) {} const h = await load('gruppo.html'); $('fG').srcdoc = h.replace('<head>', '<head>' + base() + '<style>' + PHONE_CSS + '</style><script>(' + shim.toString() + ')(false);window._phoneOrario=function(){top._showO()};<' + '/script>'); gLoaded = true; }
  async function startUI() { showUI(true); await startO(); if (tab === 'g') await startG(); show(tab); }
  async function refresh() { await startO(); if (gLoaded) await startG(); }
  window._showO = () => show('o');
  function show(t) {
    tab = t; $('fO').hidden = t !== 'o'; $('fG').hidden = t !== 'g';
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = async () => {
    const t = b.dataset.t; if (t === 'more') { $('sheet').hidden = false; return; }
    if (t === 'g' && !gLoaded) await startG(); show(t);
  });
  function schedulePush() { if (!cfg || !cfg.repo) { dirty = false; setStat('ok', 'Nur auf diesem iPhone gesichert'); return; } clearTimeout(pushT); pushT = setTimeout(push, 1500); }
  async function push(tries) {
    if (!cfg || !cfg.repo || !pw) return; if (busy) { pushT = setTimeout(push, 1500); return; } busy = true; setStat('wait', 'Wird abgeglichen …');
    try { sha = await Vault.ghPut(cfg, await Vault.seal(Vault.wrap(store.data), pw, salt), sha); dirty = false; setStat('ok', 'Abgeglichen ' + now()); busy = false; }
    catch (e) { busy = false; if (e.conflict && (tries || 0) < 3) { try { const r = await pull(); if (r.changed) await refresh(); } catch (x) { setStat('bad', x.user ? x.message : 'Abgleich fehlgeschlagen'); return; } return push((tries || 0) + 1); } setStat('bad', e.user ? e.message : navigator.onLine ? 'Abgleich fehlgeschlagen' : 'Offline – wird später abgeglichen'); }
  }
  /* GitHub-Stand holen und einarbeiten. Ändert store.data an Ort und Stelle (die Rahmen behalten ihren Bezug). */
  async function pull() {
    if (!cfg || !cfg.repo) return { changed: false, needPush: false };
    const r = await Vault.ghGet(cfg); if (!r) return { leer: true, needPush: true }; sha = r.sha; salt = r.blob.salt;
    const rem = Vault.payload(await Vault.open(r.blob, pw)), mg = Vault.merge(store.data, rem);
    mg.remoteWon.forEach(k => { const e = mg.merged[k], old = store.data[k];
      if (k === 'orario_v1' && old && old.v && e.v && old.v !== e.v) store.data.orario_prev = { v: old.v, t: Date.now() };
      store.data[k] = { v: e.v, t: e.t }; });
    if (mg.remoteWon.length) await persist();
    return { changed: mg.remoteWon.length > 0, needPush: mg.localWon.length > 0 };
  }
  async function sync() {
    if (!cfg || !cfg.repo) { setStat('ok', 'Nur auf diesem iPhone'); return; }
    if (busy) return; setStat('wait', 'Wird abgeglichen …');
    try {
      const res = await pull(); if (res.changed) await refresh();
      if (res.needPush || dirty) await push(); else setStat('ok', 'Abgeglichen ' + now());
    } catch (e) { setStat('bad', e.message === 'pw' ? 'Falsches Passwort (muss wie am Mac sein)' : e.user ? e.message : (navigator.onLine ? 'Abgleich fehlgeschlagen' : 'Offline')); }
  }
  async function afterLogin() { if ($('stay').checked) { try { await keySet(await Vault.deriveKey(pw, salt)); stayOn = true; } catch (e) {} } }
  /* Automatisch weitermachen, wenn „Angemeldet bleiben“ aktiv war */
  async function autoLogin() {
    const raw = LS.get('opv_blob'), k = raw && await keyGet(); if (!k) return false;
    try { const blob = JSON.parse(raw), o = await Vault.open(blob, k); pw = k; salt = blob.salt; store = { data: fix(o.data) }; stayOn = true;
      try { const c = LS.get('opv_cfg'); cfg = c ? await Vault.open(JSON.parse(c), k) : {}; } catch (e) { cfg = {}; }
      await startUI(); sync(); return true; } catch (e) { keyDel(); return false; }
  }
  $('lf').onsubmit = async e => {
    e.preventDefault(); showErr(''); const p = $('pw').value; if (!p) { showErr('Bitte Passwort eingeben.'); return; }
    $('go').disabled = true;
    try {
      const raw = LS.get('opv_blob');
      if (raw) { /* Entsperren */
        const blob = JSON.parse(raw); let o; try { o = await Vault.open(blob, p); } catch (x) { showErr('Falsches Passwort.'); return; }
        pw = p; salt = blob.salt; store = { data: fix(o.data) }; try { const c = LS.get('opv_cfg'); cfg = c ? await Vault.open(JSON.parse(c), p) : {}; } catch (x) { cfg = {}; }
        await afterLogin(); await startUI(); sync();
      } else { /* Einrichten */
        const repo = $('repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, ''), tok = $('tok').value.trim(), c = repo && tok ? { repo, token: tok } : {};
        let remote = null;
        if (c.repo) { try { remote = await Vault.ghGet(c); } catch (x) { showErr(x.user ? x.message : 'GitHub nicht erreichbar (' + x.message + ').'); return; } }
        if (!remote && c.repo && !window._allowEmpty) { showErr('Auf GitHub liegen noch keine Daten. Am Mac: Gruppo → Einstellungen → Daten → iPhone-Abgleich → „Jetzt abgleichen“. Danach hier erneut „Einrichten“.'); $('bEmpty').hidden = false; return; }
        if (remote) {
          let o; try { o = await Vault.open(remote.blob, p); } catch (x) { showErr('Falsches Passwort (muss dasselbe wie am Mac sein).'); return; }
          let d; try { d = Vault.payload(o); } catch (x) { showErr(x.message); return; }
          pw = p; salt = remote.blob.salt; store = { data: d }; sha = remote.sha;
        } else {
          if ($('pw2Box').hidden) { $('pw2Box').hidden = false; showErr('Neues Passwort bitte wiederholen.'); $('pw2').focus(); return; }
          if ($('pw2').value !== p) { showErr('Die Passwörter stimmen nicht überein.'); return; }
          if (p.length < 8) { showErr('Bitte mindestens 8 Zeichen.'); return; }
          pw = p; salt = Vault.newSalt(); store = { data: {} };
        }
        cfg = c; await persist(); await persistCfg(); await afterLogin(); await startUI(); setStat('ok', c.repo ? 'Abgeglichen ' + now() : 'Nur auf diesem iPhone');
      }
    } finally { $('go').disabled = false; }
  };
  $('bClose').onclick = () => { $('sheet').hidden = true; };
  $('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };
  $('bLock').onclick = lockNow;
  $('bEmpty').onclick = () => { window._allowEmpty = true; $('bEmpty').hidden = true; showErr('Dann: neues Passwort bitte unten wiederholen.'); $('pw2Box').hidden = false; $('pw2').focus(); };
  $('bSync').onclick = () => { $('sheet').hidden = true; sync(); };
  $('bCfg').onclick = async () => {
    const repo = prompt('GitHub-Repository (benutzername/name) – leer = nur dieses iPhone', cfg && cfg.repo || ''); if (repo === null) return;
    let token = cfg && cfg.token || ''; if (repo.trim()) { const t = prompt('Zugangs-Token (leer lassen = unverändert)', ''); if (t === null) return; if (t.trim()) token = t.trim(); }
    cfg = repo.trim() ? { repo: repo.trim().replace(/^https?:\/\/github\.com\//, ''), token } : {}; await persistCfg(); sha = null; $('sheet').hidden = true; sync();
  };
  $('bWipe').onclick = () => { if (!confirm('Alle Daten auf diesem iPhone löschen? (Auf GitHub und am Mac bleibt alles erhalten.)')) return; LS.del('opv_blob'); LS.del('opv_cfg'); lockNow(); };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); if (dirty && pw) { clearTimeout(pushT); push(); } }
    else if (pw && !stayOn && hiddenAt && Date.now() - hiddenAt > AUTOLOCK) lockNow();
    else if (pw) sync();
  });
  addEventListener('pagehide', () => { if (dirty && pw) { try { persist(); } catch (e) {} } });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  showLock(); autoLogin();
})();
</script>
