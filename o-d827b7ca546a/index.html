<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.sub{margin:0 0 18px;text-align:center;color:var(--tx2);font-size:14px}

.btn.sec{background:var(--fill);color:var(--tx);margin-top:8px}
.btn.red{background:rgba(216,32,28,.12);color:var(--red)}
.btn:disabled{opacity:.5}
.err{color:var(--red);font-size:14px;min-height:20px;margin:10px 4px 0;text-align:center}
.hint{font-size:13px;color:var(--tx2);margin:8px 4px 0}

.st i{width:10px;height:10px;border-radius:50%;background:#9aa1b5;flex:none}.st i.ok{background:#27ae60}.st i.wait{background:#f5a623}.st i.bad{background:var(--red)}

<body>
<div id="lock" hidden>

    <img class="ic" src="icons/icon-192.png" alt="">

      <div id="setupBox" hidden>
        <label for="repo">GitHub-Repository</label><input id="repo" placeholder="benutzername/orario-daten" autocapitalize="none" autocorrect="off" spellcheck="false">

      </div>
      <label for="pw" id="pwl">Passwort</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <div id="pw2Box" hidden><label for="pw2">Passwort wiederholen</label><input id="pw2" type="password" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
      <label class="stay" id="stayL"><input type="checkbox" id="stay"> Angemeldet bleiben (auf diesem iPhone)</label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn sec" id="bEmpty" type="button" hidden>Trotzdem ohne Mac-Daten starten</button>
      <button class="btn" id="go" type="submit">Entsperren</button>

  </div>
</div>
<iframe id="frame" hidden title="Gruppo"></iframe>
<nav id="tabs" hidden aria-label="Gruppo">
  <button data-t="dash" type="button"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="9" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.8"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.8"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.8"/></svg>Übersicht</button>
  <button data-t="groups" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.4-3.2 2.6-5 5.5-5s5.1 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.4-.1 4 1.4 4.3 4"/></svg>Gruppen</button>
  <button data-t="tm" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 1.6M9.5 3h5"/></svg>Timer</button>
  <button data-t="cl" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.4 2"/></svg>Uhr</button>
  <button data-t="pk" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.6-4 3.4-6 7-6s6.4 2 7 6"/></svg>Wer?</button>
  <button data-t="more" type="button"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.4"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"/></svg>Sperre<i id="fabDot"></i></button>
</nav>
<div id="sheet" hidden>
  <div class="box">
    <h1 style="font-size:20px;text-align:left">Gruppo privat</h1>
    <div class="st"><i id="stDot"></i><span id="stTxt">–</span></div>
    <button class="btn" id="bSync">Jetzt abgleichen</button>
    <button class="btn sec" id="bLock">Sperren / Abmelden</button>
    <details><summary>Mehr</summary>
      <button class="btn sec" id="bCfg">GitHub-Zugang ändern</button>
      <button class="btn red" id="bWipe">Daten auf diesem Gerät löschen</button>
      <p class="hint">Löschen entfernt nur dieses Gerät. Die verschlüsselte Datei auf GitHub bleibt erhalten.</p>
    </details>
    <button class="btn sec" id="bClose" style="margin-top:14px">Schließen</button>
  </div>
</div>
<script>/* theis Tresor – verschlüsselter Abgleich (AES-256-GCM, Schlüssel aus Passwort via PBKDF2-SHA256).
   Gleicher Code im iPhone-Orario und in Gruppo. Auf GitHub liegt nur verschlüsselter Text. */
(function (g) {
  const te = new TextEncoder(), td = new TextDecoder(), ITER = 600000, KEYS = ['orario_v1', 'orario_me', 'orario_mine', 'orario_prev'];

  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const keyCache = {};
  async function key(pw, saltB64, iter) {
    if (typeof pw !== 'string') return pw; /* fertiger Schlüssel (Angemeldet bleiben) */
    const id = saltB64 + '|' + iter + '|' + pw; if (keyCache[id]) return keyCache[id];
    const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return keyCache[id] = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(saltB64), iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  async function seal(obj, pw, salt) {
    salt = salt || newSalt(); const k = await key(pw, salt, ITER), iv = crypto.getRandomValues(new Uint8Array(12));

    return { v: 1, iter: ITER, salt, iv: b64(iv), ct: b64(ct) };
  }
  async function open(blob, pw) {
    const k = await key(pw, blob.salt, blob.iter || ITER);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, k, unb64(blob.ct));
    return JSON.parse(td.decode(pt));
  }
  /* GitHub (privates Repository, Datei orario.enc) */
  const API = 'https://api.github.com/repos/';
  const hdr = c => ({ Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });
  const path = c => (c.path || 'orario.enc');
  const ghErr = (st, repo, write) => { const e = new Error(st === 401 ? 'Token ungültig oder abgelaufen' : st === 403 ? 'Token ohne Berechtigung (Repository-Berechtigung „Contents“ muss „Read and write“ sein)' : st === 404 ? 'Repository „' + repo + '“ nicht gefunden oder Token hat dort keinen Zugriff' : 'GitHub ' + st); e.user = st === 401 || st === 403 || st === 404; return e; };
  async function ghGet(c) {
    const r = await fetch(API + c.repo + '/contents/' + path(c) + '?t=' + Date.now(), { headers: hdr(c), cache: 'no-store' });
    if (r.status === 404) { const q = await fetch(API + c.repo, { headers: hdr(c), cache: 'no-store' }); if (q.status === 200) return null; throw ghErr(q.status, c.repo); }
    if (!r.ok) throw ghErr(r.status, c.repo);
    const j = await r.json(); let txt;
    if (j.content) txt = td.decode(unb64(j.content.replace(/\n/g, '')));
    else { const r2 = await fetch(API + c.repo + '/contents/' + path(c), { headers: Object.assign(hdr(c), { Accept: 'application/vnd.github.raw+json' }), cache: 'no-store' }); txt = await r2.text(); }
    return { blob: JSON.parse(txt), sha: j.sha };
  }
  async function ghPut(c, blob, sha) {
    const body = { message: 'Abgleich', content: b64(te.encode(JSON.stringify(blob))) }; if (sha) body.sha = sha;
    const r = await fetch(API + c.repo + '/contents/' + path(c), { method: 'PUT', headers: Object.assign(hdr(c), { 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) { const e = new Error('conflict'); e.conflict = true; throw e; }
    if (!r.ok) throw ghErr(r.status, c.repo, true);
    return (await r.json()).content.sha;
  }
  /* Zusammenführen: je Eintrag {v, t}; der neuere gewinnt (gleich alt: lokal). v=null = gelöscht. */
  function merge(local, remote) {
    const out = {}, remoteWon = [], localWon = []; const ks = new Set(Object.keys(local || {}).concat(Object.keys(remote || {})));
    ks.forEach(k => { const l = local && local[k], r = remote && remote[k];
      if (l && (!r || l.t >= r.t)) { out[k] = l; if (!r || r.v !== l.v) localWon.push(k); } else { out[k] = r; if (!l || l.v !== r.v) remoteWon.push(k); } });
    return { merged: out, remoteWon, localWon };
  }
  g.Vault = { deriveKey: (pw, salt) => key(pw, salt, ITER), seal, open, ghGet, ghPut, merge, newSalt };
})(window);
</script>
<script>
(function () {
  const $ = id => document.getElementById(id), LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
  const AUTOLOCK = 3 * 60 * 1000; let stayOn = false;

  const fix = d => { d = d || {}; Object.keys(d).forEach(k => { if (typeof d[k] === 'string') d[k] = { v: d[k], t: 0 }; }); return d; };
  const showErr = m => { $('err').textContent = m || ''; };
  function mode() {
    const has = !!LS.get('opv_blob'); $('setupBox').hidden = has; $('pwl').textContent = has ? 'Passwort' : 'Passwort (wie in Gruppo)';
    $('go').textContent = has ? 'Entsperren' : 'Einrichten'; $('stay').checked = false; $('lsub').textContent = has ? 'Privat · verschlüsselt' : 'Einrichtung · einmalig';
    $('pw2Box').hidden = true; $('pw').autocomplete = has ? 'current-password' : 'new-password';
  }
  function showLock() { $('lock').hidden = false; $('frame').hidden = true; $('tabs').hidden = true; $('sheet').hidden = true; $('frame').srcdoc = ''; $('pw').value = ''; $('pw2').value = ''; showErr(''); $('bEmpty').hidden = true; window._allowEmpty = false; mode(); setTimeout(() => { try { $('pw').focus(); } catch (e) {} }, 50); }
  function lockNow() { keyDel(); stayOn = false; pw = ''; store = { data: {} }; window._opData = null; cfg = null; sha = null; clearTimeout(saveT); clearTimeout(pushT); showLock(); }
  /* Das Aussehen (Theme, Schrift, hell/dunkel) bleibt auf diesem Gerät und wird nie abgeglichen */
  const shared = () => { const d = Object.assign({}, store.data); delete d.gb_look; return d; };
  async function persist() { LS.set('opv_blob', JSON.stringify(await Vault.seal({ data: store.data }, pw, salt))); }
  async function persistCfg() { LS.set('opv_cfg', JSON.stringify(await Vault.seal(cfg || {}, pw, salt))); }

  function shim() {

    const ls = { getItem: k => live(k) ? m[k].v : null, setItem: (k, v) => { v = String(v); if (!m[k] || m[k].v !== v) { m[k] = { v, t: Date.now() }; T._opChanged(); } }, removeItem: k => { if (live(k)) { m[k] = { v: null, t: Date.now() }; T._opChanged(); } }, clear() {}, key: i => Object.keys(m).filter(live)[i] || null };

    Object.defineProperty(HTMLIFrameElement.prototype, 'srcdoc', { set(v) { d.set.call(this, String(v).replace('<head>', '<head>' + inner)); }, get() { return d.get.call(this); } });
  }

  /* Nur für das iPhone: Kopfleiste ordentlich in zwei Zeilen, nichts scheint durch, Platz unten für den Schloss-Knopf */
  const PHONE_CSS = '@media (max-width:700px){'
    + 'html{background:var(--canvas,#eef0f5)}'
    + 'body{padding-bottom:calc(var(--sab,0px) + 84px)!important}'
    + '.toolbar{position:sticky;top:0;padding:calc(var(--sat,0px) + 6px) 10px 6px!important;background:var(--canvas,#eef0f5);z-index:40}'
    + '.toolbar .bar{display:flex!important;flex-wrap:wrap!important;align-items:center;justify-content:space-between;gap:6px 6px!important;padding:8px 10px!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--glass-solid)!important;box-shadow:0 0 0 .5px var(--hairline)}'
    + '.toolbar h1{display:none!important}'
    + '.toolbar .picker{flex:1 1 0;min-width:0}.toolbar .picker select,.toolbar .picker .classBtn{width:100%}'
    + '.toolbar #addBtn,.toolbar #editBtn{font-size:0!important;width:38px;min-width:38px;padding:0!important;text-align:center}'
    + '.toolbar #addBtn::before{content:"+";font-size:22px;line-height:36px}.toolbar #editBtn::before{content:"\\270E";font-size:18px;line-height:36px}'

  function insets() { const d = document.createElement('div'); d.style.cssText = 'position:fixed;visibility:hidden;top:0;left:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)'; document.body.appendChild(d); const cs = getComputedStyle(d), r = [parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingBottom) || 0]; d.remove(); return r; }

  addEventListener('resize', setInsets); addEventListener('orientationchange', () => setTimeout(setInsets, 300));

  /* Tab-Leiste unten: steuert die Gruppo-Oberfläche im Rahmen */
  const TAB = { dash: 'vDashBtn', groups: 'vGroupsBtn', tm: 'tmBtn', cl: 'clBtn', pk: 'pkBtn' };
  function fdoc() { try { return $('frame').contentDocument; } catch (e) { return null; } }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
    const t = b.dataset.t; if (t === 'more') { $('sheet').hidden = false; return; }

  setInterval(() => {
    const d = fdoc(); if (!d || $('tabs').hidden) return;
    const ovOpen = !!d.querySelector('.ov:not([hidden])') || !!d.querySelector('dialog[open]');
    $('tabs').classList.toggle('away', ovOpen);
    const on = id => { const e = d.getElementById(id); return !!(e && e.classList.contains('on')); };
    document.querySelectorAll('#tabs button').forEach(b => { const t = b.dataset.t; b.classList.toggle('on', t === 'dash' ? on('vDashBtn') : t === 'groups' ? on('vGroupsBtn') : false); });
  }, 350);
  async function startFrame() {
    let html = await (await fetch('gruppo.html', { cache: 'no-cache' })).text();
    window._opData = store.data;
    const ins = insets();
    html = html.replace('<head>', '<head><base href="' + location.href.replace(/[^/]*$/, '') + '"><style>html{--sat:' + ins[0] + 'px;--sab:' + ins[1] + 'px}' + PHONE_CSS + '</style><script>(' + shim.toString() + ')();<' + '/script>');

  }

    dirty = true; setStat('wait', 'Änderung wird gesichert …');
    clearTimeout(saveT); saveT = setTimeout(async () => { try { await persist(); } catch (e) {} schedulePush(); }, 700);
  };
  function schedulePush() { if (!cfg || !cfg.repo) { dirty = false; setStat('ok', 'Nur auf diesem Gerät gesichert'); return; } clearTimeout(pushT); pushT = setTimeout(push, 1500); }

    const r = await Vault.ghGet(cfg); if (!r) return { leer: true, needPush: true }; sha = r.sha; salt = r.blob.salt;
    const o = await Vault.open(r.blob, pw); if (o.data) delete o.data.gb_look; const mg = Vault.merge(store.data, o.data || {});
    if (mg.remoteWon.length) { store.data = mg.merged; await persist(); }
    return { changed: mg.remoteWon.length > 0, needPush: mg.localWon.length > 0 };
  }
  async function sync() {
    if (!cfg || !cfg.repo) { setStat('ok', 'Nur auf diesem Gerät'); return; }
    setStat('wait', 'Wird abgeglichen …');
    try {
      const res = await pull(); if (res.changed) await startFrame();
      if (res.needPush || dirty) await push(); else setStat('ok', 'Abgeglichen ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }));
    } catch (e) { setStat('bad', e.message === 'pw' ? 'Falsches Passwort (muss wie am Mac sein)' : e.user ? e.message : (navigator.onLine ? 'Abgleich fehlgeschlagen' : 'Offline')); }
  }
  async function afterLogin() { if ($('stay').checked) { try { await keySet(await Vault.deriveKey(pw, salt)); stayOn = true; } catch (e) {} } }
  /* Automatisch weitermachen, wenn „Angemeldet bleiben“ aktiv war */
  async function autoLogin() {
    const raw = LS.get('opv_blob'), k = raw && await keyGet(); if (!k) return false;
    try { const blob = JSON.parse(raw), o = await Vault.open(blob, k); pw = k; salt = blob.salt; store = { data: fix(o.data) }; stayOn = true;
      try { const c = LS.get('opv_cfg'); cfg = c ? await Vault.open(JSON.parse(c), k) : {}; } catch (e) { cfg = {}; }
      await startFrame(); sync(); return true; } catch (e) { keyDel(); return false; }
  }
  $('lf').onsubmit = async e => {
    e.preventDefault(); showErr(''); const p = $('pw').value; if (!p) { showErr('Bitte Passwort eingeben.'); return; }
    $('go').disabled = true;
    try {
      const raw = LS.get('opv_blob');
      if (raw) { /* Entsperren */
        const blob = JSON.parse(raw); let o; try { o = await Vault.open(blob, p); } catch (x) { showErr('Falsches Passwort.'); return; }
        pw = p; salt = blob.salt; store = { data: fix(o.data) }; try { const c = LS.get('opv_cfg'); cfg = c ? await Vault.open(JSON.parse(c), p) : {}; } catch (x) { cfg = {}; }
        await afterLogin(); await startFrame(); sync();
      } else { /* Einrichten */
        const repo = $('repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, ''), tok = $('tok').value.trim(), c = repo && tok ? { repo, token: tok } : {};
        let remote = null;
        if (c.repo) { try { remote = await Vault.ghGet(c); } catch (x) { showErr('GitHub nicht erreichbar oder Zugang falsch (' + x.message + ').'); return; } }
        if (!remote && c.repo && !window._allowEmpty) { showErr('Auf GitHub liegen noch keine Daten. Gruppo am Mac: Einstellungen → Daten → iPhone-Abgleich → „Jetzt abgleichen“. Danach hier erneut „Einrichten“.'); $('bEmpty').hidden = false; return; }
        if (remote) { let o; try { o = await Vault.open(remote.blob, p); } catch (x) { showErr('Falsches Passwort (muss dasselbe wie in Gruppo sein).'); return; } pw = p; salt = remote.blob.salt; store = { data: fix(o.data) }; sha = remote.sha; }
        else {
          if ($('pw2Box').hidden) { $('pw2Box').hidden = false; showErr(c.repo ? 'Noch keine Daten auf GitHub. Neues Passwort bitte wiederholen.' : 'Neues Passwort bitte wiederholen.'); $('pw2').focus(); return; }
          if ($('pw2').value !== p) { showErr('Die Passwörter stimmen nicht überein.'); return; }
          if (p.length < 8) { showErr('Bitte mindestens 8 Zeichen.'); return; }
          pw = p; salt = Vault.newSalt(); store = { data: {} };
        }
        cfg = c; await persist(); await persistCfg(); await afterLogin(); await startFrame(); if (c.repo && !remote) { dirty = true; push(); } else setStat('ok', c.repo ? 'Abgeglichen' : 'Nur auf diesem Gerät');
      }
    } finally { $('go').disabled = false; }
  };
    $('bClose').onclick = () => { $('sheet').hidden = true; };
  $('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };
  $('bLock').onclick = lockNow;
  $('bEmpty').onclick = () => { window._allowEmpty = true; $('bEmpty').hidden = true; showErr('Dann: neues Passwort bitte unten wiederholen.'); $('pw2Box').hidden = false; $('pw2').focus(); };
  $('bSync').onclick = () => { $('sheet').hidden = true; sync(true); };
  $('bCfg').onclick = async () => {
    const repo = prompt('GitHub-Repository (benutzername/name) – leer = nur dieses Gerät', cfg && cfg.repo || ''); if (repo === null) return;
    let token = cfg && cfg.token || ''; if (repo.trim()) { const t = prompt('Zugangs-Token (leer lassen = unverändert)', ''); if (t === null) return; if (t.trim()) token = t.trim(); }
    cfg = repo.trim() ? { repo: repo.trim().replace(/^https?:\/\/github\.com\//, ''), token } : {}; await persistCfg(); sha = null; $('sheet').hidden = true; sync(true);
  };
  $('bWipe').onclick = () => { if (!confirm('Alle Gruppo-Daten auf diesem Gerät löschen? (Auf GitHub bleibt die verschlüsselte Kopie.)')) return; LS.del('opv_blob'); LS.del('opv_cfg'); lockNow(); };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); if (dirty) { clearTimeout(pushT); push(); } }
    else if (pw && !stayOn && hiddenAt && Date.now() - hiddenAt > AUTOLOCK) lockNow();
    else if (pw) sync();
  });
  addEventListener('pagehide', () => { if (dirty) { try { persist(); } catch (e) {} } });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  showLock(); autoLogin();
})();
</script>
