<style>:root{--bg:#eef0f5;--wa:rgba(47,91,234,.16);--wb:rgba(150,110,240,.14);--glass:rgba(255,255,255,.72);--solid:#fff;--line:rgba(20,30,60,.10);--tx:#14182b;--tx2:#5a6078;--blue:#2F5BEA;--blue-t:rgba(47,91,234,.12);--ok:#1f9d6b;--warn:#c2680a;--fill:rgba(20,30,60,.07);--r:18px;--sh:0 1px 2px rgba(20,30,60,.06),0 8px 28px rgba(20,30,60,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1020;--wa:rgba(47,91,234,.26);--wb:rgba(150,110,240,.16);--glass:rgba(28,32,54,.70);--solid:#1b1f36;--line:rgba(255,255,255,.12);--tx:#eef0fb;--tx2:#9aa1bd;--blue:#6f93ff;--blue-t:rgba(111,147,255,.18);--fill:rgba(255,255,255,.08);--sh:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0d1020;--wa:rgba(47,91,234,.26);--wb:rgba(150,110,240,.16);--glass:rgba(28,32,54,.70);--solid:#1b1f36;--line:rgba(255,255,255,.12);--tx:#eef0fb;--tx2:#9aa1bd;--blue:#6f93ff;--blue-t:rgba(111,147,255,.18);--fill:rgba(255,255,255,.08);--sh:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 10% -10%,var(--wa),transparent 60%),radial-gradient(800px 500px at 100% 0,var(--wb),transparent 60%),var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{width:100%;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));max-width:1500px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding:16px 0 10px}
.app-t{font-weight:700;font-size:22px;letter-spacing:-.02em}.app-t small{display:block;font-weight:500;font-size:12px;color:var(--tx2);letter-spacing:0}
.grow{flex:1}
.ibtn{border:0;background:var(--fill);width:40px;height:40px;border-radius:12px;font-size:18px;display:grid;place-items:center}
.ibtn:hover{background:var(--blue-t)}
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:16px}
.seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:10px;font-weight:600;color:var(--tx2)}
.seg button[aria-pressed=true]{background:var(--solid);color:var(--tx);box-shadow:0 1px 4px rgba(20,30,60,.15)}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid var(--line);background:var(--solid);font-size:17px;outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-t)}
.search:before{content:"";position:absolute;left:14px;top:50%;width:14px;height:14px;margin-top:-9px;border:2px solid var(--tx2);border-radius:50%;opacity:.7}
.search:after{content:"";position:absolute;left:28px;top:50%;width:7px;height:2px;margin-top:6px;background:var(--tx2);transform:rotate(45deg);opacity:.7}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:7px 13px;font-size:15px}
.chip:hover,.chip:focus-visible{border-color:var(--blue);background:var(--blue-t);outline:none}
.chip small{color:var(--tx2);margin-left:4px}
.hint{color:var(--tx2);font-size:14px}
h2{font-size:15px;margin:0 0 8px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.now{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.nowwho{font-size:26px;font-weight:700;letter-spacing:-.02em}
.nowwho a,.lk{color:var(--blue);cursor:pointer;text-decoration:none;border:0;background:none;padding:0;font-weight:inherit}
.lk:hover{text-decoration:underline}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--blue-t);color:var(--blue);font-weight:600;font-size:14px}
.pill.ok{background:rgba(31,157,107,.14);color:var(--ok)}.pill.mut{background:var(--fill);color:var(--tx2)}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--blue)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}
.les{background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.les b{font-size:19px}.les .rm{float:right;font-weight:700;color:var(--blue);font-size:18px}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.pick select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--solid)}
.btn{border:0;background:var(--blue);color:var(--onb,#fff);border-radius:12px;padding:10px 18px;font-weight:600}
.btn.sec{background:var(--fill);color:var(--tx)}.btn.danger{background:rgba(214,60,60,.14);color:#c2342f}
.btn[disabled]{opacity:.5}
.tw{overflow:auto;border-radius:14px;border:1px solid var(--line);background:var(--solid);margin-top:6px}
table.wk{border-collapse:collapse;width:100%;min-width:680px;table-layout:fixed}
.wk th{font-size:13px;color:var(--tx2);padding:8px 4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--solid)}
.wk th.td{color:var(--blue)}
.wk td{border:1px solid var(--line);padding:3px 5px;vertical-align:middle;font-size:13px;height:46px}
.wk td.pn{width:62px;text-align:center;background:var(--fill);font-size:12px;color:var(--tx2);cursor:pointer}
.wk td.pn b{display:block;font-size:17px;color:var(--tx)}
.wk td.ce{cursor:pointer;background:var(--blue-t)}
.wk td.ce:hover{outline:2px solid var(--blue);outline-offset:-2px}
.wk td.em{cursor:pointer}.wk td.em:hover{background:var(--fill)}
.wk td.sel{box-shadow:inset 0 0 0 2.5px var(--blue)}
.wk td.bk{border-top:2.5px double var(--line)}
.wk .e{line-height:1.25}.wk .e+.e{margin-top:3px;padding-top:3px;border-top:1px dashed var(--line)}
.wk .e b{font-size:14px}.wk .e i{color:var(--tx2);font-style:normal;float:right;margin-left:6px}
.wk .g{opacity:.9}
footer.brand{display:flex;justify-content:center;align-items:center;gap:10px;padding:28px 0 24px;color:var(--tx2);font-size:13px;opacity:.8}
footer.brand a{display:inline-flex;color:var(--tx)}footer.brand svg{height:19px;width:auto}
.logo path{fill:currentColor}
.drop{border:2px dashed color-mix(in srgb,var(--blue) 45%,transparent);border-radius:22px;text-align:center;padding:44px 20px;background:var(--blue-t)}
.drop.over{background:color-mix(in srgb,var(--blue) 25%,transparent)}
.drop h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
.prog{height:10px;border-radius:99px;background:var(--fill);overflow:hidden;margin:14px 0 6px}.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .15s}
.sheet{position:fixed;inset:0;background:rgba(10,14,30,.45);display:grid;place-items:center;padding:16px;z-index:20}
.sheet[hidden]{display:none}
.sheet .card{background:var(--solid);width:min(560px,100%);max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0}.stat b{text-align:right}
.note{background:rgba(194,104,10,.12);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.today{background:rgba(47,91,234,.07)}
.list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;margin:8px 0;background:var(--fill)}
@media(max-width:700px){.big{font-size:34px}.nowwho{font-size:22px}header.top{padding-top:12px}}
@media print{.noprint,header.top .ibtn,.pick,.bar{display:none!important}body{background:#fff}}
@media(max-width:700px){table.wk{min-width:500px}.wk td{font-size:12px;padding:2px 4px}.wk td.pn{width:46px}.wk th{font-size:12px}.card{padding:14px}}

body.emb footer.brand{display:none}body.emb header.top{padding-top:6px}body.emb .app-t{display:none}

.wkh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wk.ed td{outline:1px dashed color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:-3px;cursor:pointer}
.wk.ed td.em:hover{background:color-mix(in srgb,var(--blue) 10%,transparent)}
.wk.ed td.em:hover::after{content:"+";color:var(--blue);font-size:20px;font-weight:600}
#sheetBody input{border:1px solid var(--line,rgba(120,120,128,.3));background:var(--fill);color:var(--tx);border-radius:10px;padding:8px 10px;font:inherit;min-width:0}
.wk tr.brk td{height:20px;padding:0 8px;font-size:11px;color:var(--tx2);background:repeating-linear-gradient(135deg,var(--fill) 0 6px,transparent 6px 12px);text-align:center;border-left:0;border-right:0;letter-spacing:.04em}
.wk.ed .e{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.wk.ed .e.lifted{opacity:.35}
.wk td.dt{outline:3px solid var(--blue)!important;outline-offset:-3px;background:var(--blue-t)}
.e.ghost{position:fixed;z-index:99;pointer-events:none;background:var(--solid);border-radius:10px;padding:6px 8px;box-shadow:0 10px 30px rgba(20,30,60,.3);opacity:.95;line-height:1.25}
body.dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
:root[data-theme=dark] .seg button[aria-pressed=true]{background:color-mix(in srgb,var(--tx) 20%,var(--solid));box-shadow:0 2px 8px rgba(0,0,0,.35)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button[aria-pressed=true]{background:color-mix(in srgb,var(--tx) 20%,var(--solid));box-shadow:0 2px 8px rgba(0,0,0,.35)}}
.abc{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.abc button{min-width:34px;height:34px;border:0;border-radius:9px;background:var(--fill);color:var(--tx);font-weight:600;font-size:14px}
.abc button[aria-pressed=true]{background:var(--blue);color:var(--onb,#fff)}
.freebox{padding:10px 12px;margin:0 0 12px}
.freebox summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.freebox summary::-webkit-details-marker{display:none}
.freebox summary::after{content:"›";margin-left:auto;color:var(--tx2);font-size:20px;transition:transform .2s}
.freebox[open] summary::after{transform:rotate(90deg)}
.chip.free{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--tx)}
.les .rm.lk{border:0;font:inherit}
/* iPhone quer: Wochenplan füllt den Bildschirm */
@media (orientation:landscape) and (max-height:520px){
  header.top,footer.brand{display:none}
  .wrap{padding-top:6px}
  table.wk{min-width:0}
  .wk th{padding:3px 2px;font-size:11px}
  .wk td{height:26px;padding:1px 3px;font-size:11px;line-height:1.15}
  .wk td .hint{font-size:10px}
  .wk .pn{font-size:10px}
  .wk tr.brk td{height:auto;padding:0 4px;font-size:9.5px}
}
/* Eingebettet: Formen passend zum Gruppo-Theme */
:root[data-skin=graphit]{--r:2px}:root[data-skin=graphit] .card,:root[data-skin=graphit] .chip,:root[data-skin=graphit] .btn,:root[data-skin=graphit] .seg,:root[data-skin=graphit] .seg button,:root[data-skin=graphit] .search input{border-radius:2px}

:root[data-skin=klar] .card{box-shadow:none;border:1px solid var(--line)}

:root[data-skin=salbei],:root[data-skin=wald]{--r:28px}

.frhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.frhead b{margin-right:auto;font-size:16px}
.frhead select{min-height:36px}
.chip[aria-pressed=true]{background:var(--blue);color:var(--onb,#fff);border-color:var(--blue)}

<script>/* Orario – liest eine Untis-Stundenplanseite (Lehrer- oder Klassenplan) aus Textteilen + Gitterlinien */
(function (g) {
  const DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
  const near = (a, b, t) => Math.abs(a - b) <= t;

    const valid = (head.filter(i => /\d{1,2}\.\d{1,2}\./.test(i.s) && i.y < raw.h - 40 && i.y > hy + 20 && !/\d{1,2}:\d{2}/.test(i.s))[0] || {}).s || '';

        const covered = []; bands.forEach((b, bi) => { const c = (b.top + b.bot) / 2; if (c < rg.top && c > rg.bot && bandPeriod[bi]) covered.push(bandPeriod[bi].n); });

async function stpExtractPage(page){
  const O = pdfjsLib.OPS, tc = await page.getTextContent(), items = [];
  for (const it of tc.content ? tc.content.items : tc.items){
    const s = it.str; if (!s || !s.trim()) continue;
    const t = it.transform; items.push({ s: s, x: t[4], y: t[5], w: it.width, h: Math.hypot(t[2], t[3]) });
  }
  const ol = await page.getOperatorList(), hs = [], vs = [], fl = [];
  let m = [1, 0, 0, 1, 0, 0]; const st = [];
  const mul = (a, b) => [a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1], a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3], a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];
  const ap = (p) => [m[0]*p[0]+m[2]*p[1]+m[4], m[1]*p[0]+m[3]*p[1]+m[5]];
  let segs = [];
  ol.fnArray.forEach((fn, i) => {
    const a = ol.argsArray[i];
    if (fn === O.save) st.push(m.slice());
    else if (fn === O.restore) m = st.pop() || m;
    else if (fn === O.transform) m = mul(m, a);
    else if (fn === O.constructPath){
      segs = []; let c = 0, cur = null;
      a[0].forEach(op => {
        if (op === O.moveTo){ cur = ap([a[1][c], a[1][c+1]]); c += 2; }
        else if (op === O.lineTo){ const q = ap([a[1][c], a[1][c+1]]); c += 2; if (cur) segs.push([cur, q]); cur = q; }
        else if (op === O.rectangle){ const p0 = ap([a[1][c], a[1][c+1]]), p1 = ap([a[1][c]+a[1][c+2], a[1][c+1]+a[1][c+3]]); c += 4; segs.push(['r', p0, p1]); }
        else if (op === O.closePath){} else if (op === O.curveTo) c += 6;
      });
      segs.cur = segs;
    } 
    else if (fn === O.stroke || fn === O.closeStroke){
      (segs || []).forEach(sg => {
        if (sg[0] === 'r'){ const [p0, p1] = [sg[1], sg[2]], x0 = Math.min(p0[0], p1[0]), x1 = Math.max(p0[0], p1[0]), y0 = Math.min(p0[1], p1[1]), y1 = Math.max(p0[1], p1[1]);
          hs.push({ y: y0, x0, x1 }); hs.push({ y: y1, x0, x1 }); vs.push({ x: x0, y0, y1 }); vs.push({ x: x1, y0, y1 }); }
        else { const [p, q] = sg; if (Math.abs(p[1]-q[1]) < .3) hs.push({ y: p[1], x0: Math.min(p[0], q[0]), x1: Math.max(p[0], q[0]) }); else if (Math.abs(p[0]-q[0]) < .3) vs.push({ x: p[0], y0: Math.min(p[1], q[1]), y1: Math.max(p[1], q[1]) }); }
      }); segs = [];
    }
    else if (fn === O.fill || fn === O.eoFill || fn === O.fillStroke || fn === O.eoFillStroke){
      const pts = []; (segs || []).forEach(sg => { if (sg[0] === 'r'){ pts.push(sg[1], sg[2]); } else { pts.push(sg[0], sg[1]); } });
      if (pts.length >= 2){ const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); fl.push({ x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) }); } segs = [];
    } else if (fn === O.endPath) segs = [];
  });
  const vp = page.getViewport({ scale: 1 });
  return { items, hs, vs, fl, w: vp.width, h: vp.height };
}

function _(k, ...a) { const v = D[k]; let r = (v && LI > 0 && v[LI - 1]) || k; a.forEach((x, i) => { r = r.split('{' + i + '}').join(x); }); return r; }
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return mem[k] ? JSON.parse(mem[k]) : null; } },
  set(k, v) { const s = JSON.stringify(v); try { localStorage.setItem(k, s); mem[k] = s; return true; } catch (e) { mem[k] = s; return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} delete mem[k]; }
};
let DATA = null, IDX = null, S = { tab: 't', q: '', sel: null, mode: 'now', d: 0, p: 1 };

/* ---------- Daten ---------- */
function validData(d) { return d && d.v === 1 && d.teachers && d.classes && Array.isArray(d.periods) && d.periods.length; }
function load() { const d = store.get(KEY); DATA = validData(d) ? d : null; IDX = DATA ? buildIndex(DATA) : null; }
function sortCls(a, b) { const f = s => { const m = /^(\d+)([A-Za-z]*)$/.exec(s); return m ? [0, +m[1], m[2]] : [1, 0, s]; }, x = f(a), y = f(b); return x[0] - y[0] || x[1] - y[1] || (x[2] < y[2] ? -1 : x[2] > y[2] ? 1 : 0); }
function buildIndex(D) {
  const names = Object.keys(D.teachers), bySur = {};
  names.forEach(n => { const k = fold(n).split(/\s+/)[0]; (bySur[k] = bySur[k] || []).push(n); });
  function match(str) {
    const s = fold(str).trim(); if (!s) return null; const ex = names.find(n => fold(n) === s); if (ex) return ex;
    const t = s.split(/\s+/), c = bySur[t[0]] || []; if (c.length === 1 && t.length === 1) return c[0];
    if (!c.length) { if (t.length === 1 && t[0].length >= 5) { const pf = names.filter(n => fold(n).split(/\s+/)[0].startsWith(t[0])); if (pf.length === 1) return pf[0]; } return null; }
    if (t[1]) { const f = c.filter(n => (fold(n).split(/\s+/)[1] || '')[0] === t[1][0]); if (f.length === 1) return f[0]; const f2 = c.filter(n => fold(n).startsWith(s)); if (f2.length === 1) return f2[0]; }
    if (c.length === 1) return c[0];
    if (t.length === 1 && t[0].length >= 5) { const pf = names.filter(n => fold(n).split(/\s+/)[0].startsWith(t[0]) || t[0].startsWith(fold(n).split(/\s+/)[0]) && fold(n).split(/\s+/)[0].length >= 5); if (pf.length === 1) return pf[0]; }
    return null;
  }
  const T = {}, C = {};
  names.forEach(n => { T[n] = { name: n, plan: true, homeroom: D.teachers[n].homeroom || '', lessons: D.teachers[n].lessons.slice() }; });
  const seen = new Set();
  Object.keys(D.classes).forEach(c => {
    const cd = D.classes[c]; C[c] = { name: c, plan: true, leader: cd.leader || '', deputy: cd.deputy || '', lessons: cd.lessons.slice() };
    cd.lessons.forEach(l => { if (!l.teacher) return; const tn = match(l.teacher) || l.teacher; if (D.teachers[tn]) return;
      const k = [tn, l.d, l.p0, c, l.fach].join('|'); if (seen.has(k)) return; seen.add(k);
      (T[tn] = T[tn] || { name: tn, plan: false, homeroom: '', lessons: [] }).lessons.push({ d: l.d, p0: l.p0, p1: l.p1, cls: c, fach: l.fach, room: l.room, grp: l.grp }); });
  });
  names.forEach(n => D.teachers[n].lessons.forEach(l => { const c = l.cls; if (!c || !CLS.test(c) || D.classes[c]) return;
    (C[c] = C[c] || { name: c, plan: false, leader: '', deputy: '', lessons: [] }).lessons.push({ d: l.d, p0: l.p0, p1: l.p1, fach: l.fach, teacher: n, room: l.room, grp: l.grp }); }));
  Object.values(C).forEach(c => { c.leader = c.leader; });
  /* Klassenleitung aus Klassenplänen an Lehrkräfte hängen */
  Object.values(C).forEach(c => { [c.leader].forEach(l => { const tn = l && match(l); if (tn && T[tn] && !T[tn].homeroom) T[tn].homeroom = c.name; }); });
  /* Räume: aus allen Stunden (Lehrkräfte + Klassen) – wer ist wann in welchem Raum */
  const R = {}, rk = new Set();
  const addR = (l, teacher, cls) => { const r = (l.room || '').trim(); if (!r) return; const k = [r, l.d, l.p0, l.p1, cls || '', teacher || ''].join('|'); if (rk.has(k)) return; rk.add(k);
    (R[r] = R[r] || { name: r, plan: true, lessons: [] }).lessons.push({ d: l.d, p0: l.p0, p1: l.p1, fach: l.fach, cls: cls || '', teacher: teacher || '', room: r, grp: l.grp }); };
  Object.values(T).forEach(t => t.lessons.forEach(l => addR(l, t.name, l.cls)));
  Object.values(C).forEach(c => c.lessons.forEach(l => { const tn = l.teacher ? (match(l.teacher) || l.teacher) : ''; if (!rk.has([(l.room || '').trim(), l.d, l.p0, l.p1, c.name, tn].join('|'))) addR(l, tn, c.name); }));
  const rnames = Object.keys(R).sort((a, b) => a.localeCompare(b, 'de', { numeric: true }));
  return { T, C, R, match, tnames: Object.keys(T).sort((a, b) => a.localeCompare(b, 'de')), cnames: Object.keys(C).sort(sortCls), rnames };
}

function applyMine() { try { const m = store.get(MINE); if (!DATA || !m || !m.name || !DATA.teachers[m.name]) return; const E = DATA.teachers[m.name]; if (!E.edited) { m.orig = E.lessons; store.set(MINE, m); } E.lessons = JSON.parse(JSON.stringify(m.lessons)); E.edited = true; } catch (e) {} }

/* ---------- Zeit ---------- */
const mins = t => { const m = /^(\d+):(\d+)/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
const per = n => DATA.periods.find(p => p.n === n);
function nowSlot() {
  const n = new Date(), d = (n.getDay() + 6) % 7, m = n.getHours() * 60 + n.getMinutes(); let cur = null, next = null, last = null;
  DATA.periods.forEach(p => { const a = mins(p.from), b = mins(p.to); if (a == null) return; if (m >= a && m < b) cur = p; else if (a > m && !next) next = p; if (b <= m) last = p; });
  return { d, m, cur, next, last, weekend: d > 4 };
}
function resolve() {
  if (S.mode === 'pick') return { d: S.d, p: S.p, state: 'pick' };
  const n = nowSlot();
  if (n.weekend) return { d: 0, p: 1, state: 'weekend' };
  if (n.cur) return { d: n.d, p: n.cur.n, state: 'now' };
  if (n.next) return { d: n.d, p: n.next.n, state: 'break', n };
  return { d: n.d, p: DATA.periods[DATA.periods.length - 1].n, state: 'over' };
}
const at = (E, d, p) => E.lessons.filter(l => l.d === d && l.p0 <= p && p <= l.p1);
function nextLesson(E, d, p) {
  const maxP = Math.max(...DATA.periods.map(x => x.n));
  for (let k = 0; k < 7; k++) { const day = (d + k) % 7; if (day > 4) continue;
    const cand = E.lessons.filter(l => l.d === day && (k > 0 || l.p0 > p)).sort((a, b) => a.p0 - b.p0)[0]; if (cand) return cand; }
  return null;
}

}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; const [tab, ...rest] = b.dataset.go.split(':'); S.tab = tab; S.q = ''; choose(rest.join(':')); });

/* ---------- Einlesen ---------- */
function openSheet(html) { $('sheetBody').innerHTML = html; $('sheet').hidden = false; }

$('sheet').addEventListener('click', e => { if (e.target === $('sheet') && !$('sheet').dataset.lock) closeSheet(); });
function toastMsg(m) { openSheet(`<p>${esc(m)}</p><div class="row"><button class="btn" type="button" id="ok">OK</button></div>`); $('ok').onclick = closeSheet; }
async function readPdf(file, onProg) {

}
async function importFiles(files) {

  const recs = []; let done = 0, total = 0;
  try {
    for (const f of pdfs) { const r = await readPdf(f, (n, t) => { $('pg').style.width = Math.round(100 * (done + n / t) / pdfs.length) + '%'; $('pt').textContent = _('{0} – Seite {1} von {2}', f.name, n, t); }); recs.push(...r); done++; }
  } catch (err) { delete $('sheet').dataset.lock; return toastMsg(_('Die Datei konnte nicht gelesen werden: {0}', err.message || err)); }
  delete $('sheet').dataset.lock; reviewImport(recs, pdfs.map(f => f.name));
}
function aggregate(recs) {

    if (r.type === 'teacher') { const o = R.teachers[r.name] = R.teachers[r.name] || { homeroom: '', lessons: [] }; o.homeroom = o.homeroom || r.homeroom; o.lessons.push(...r.lessons); }
    else { const nm = OrarioParse.normClass(r.name), o = R.classes[nm] = R.classes[nm] || { leader: r.leader, deputy: r.deputy, lessons: [] }; o.lessons.push(...r.lessons); }

}

  const old = DATA; let drop = '';
  const keepT = !R.nT && old && old.year === R.year, keepC = !R.nC && old && old.year === R.year;
  if (!R.nT && old && Object.keys(old.teachers).length && !keepT) drop = _('Die bisherigen Lehrerpläne ({0}) werden ersetzt.', old.year || _('anderes Schuljahr'));

  ${R.bad.length ? `<div class="note">${_('{0} Seite(n) konnten nicht gelesen werden.', R.bad.length)}</div><div class="list">${R.bad.slice(0, 30).map(esc).join('<br>')}</div>` : ''}
  ${R.warn.length ? `<p class="hint">${_('{0} Zeile(n) mit ungewöhnlichem Aufbau wurden übernommen.', R.warn.length)}</p>` : ''}${drop ? `<div class="note">${esc(drop)} ${_('Der vorherige Stand bleibt als Sicherung erhalten.')}</div>` : ''}
  ${old ? '' : ''}<div class="row"><button class="btn" id="take" type="button">${_('Übernehmen')}</button><button class="btn sec" id="no" type="button">${_('Verwerfen')}</button></div>`);

}
function restoreJson(f) {
  f.text().then(t => { let d; try { d = JSON.parse(t); } catch (e) {} if (!validData(d)) return toastMsg(_('Das ist keine gültige Orario-Sicherung.'));
    if (DATA) store.set(PREV, DATA); DATA = d; persist(); IDX = buildIndex(DATA); S = { tab: 't', q: '', sel: null, mode: 'now', d: 0, p: 1 }; render(); toastMsg(_('Sicherung eingespielt.')); });
}

/* ---------- Einstellungen ---------- */
function settings() {

  openSheet(`<h3>${_('Pläne und Daten')}</h3>${DATA ? `<div class="stat"><span>${_('Schuljahr')}</span><b>${esc(DATA.year || '–')}</b><span>${_('Stand')}</span><b>${esc(DATA.stamp || '–')}</b><span>${_('gültig ab')}</span><b>${esc(DATA.valid || '–')}</b><span>${_('Lehrkräfte / Klassen')}</span><b>${n} / ${c}</b></div>` : `<p class="hint">${_('Noch keine Pläne eingelesen.')}</p>`}
  <p class="hint">${_('Neues Schuljahr? Einfach die neuen Untis-PDFs einlesen – sie ersetzen die alten. Der vorherige Stand bleibt als Sicherung erhalten.')}</p>
  ${DATA ? `<div class="pick"><label for="sMe" class="hint">${_('Das bin ich:')}</label><select id="sMe"><option value="">${_('– nicht festgelegt –')}</option>${IDX.tnames.map(n => `<option${n === myName() ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></div>` : ''}<div class="row"><button class="btn" id="sImp" type="button">${_('Pläne einlesen …')}</button>${prev ? `<button class="btn sec" id="sPrev" type="button">${_('Vorherigen Stand zurückholen')}</button>` : ''}</div>

  <p class="hint" style="margin-top:16px">${_('Alle Pläne bleiben auf diesem Gerät – nichts wird hochgeladen.')} Orario ${VERSION} · theis</p><div class="row"><button class="btn sec" id="sClose" type="button">${_('Schließen')}</button></div>`);

  if ($('sExp')) $('sExp').onclick = () => { const b = new Blob([JSON.stringify(DATA)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'orario-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
  if ($('sDel')) $('sDel').onclick = () => { openSheet(`<h3>${_('Alles löschen?')}</h3><p>${_('Die eingelesenen Pläne werden von diesem Gerät entfernt. Du kannst sie jederzeit neu einlesen.')}</p><div class="row"><button class="btn danger" id="yes" type="button">${_('Löschen')}</button><button class="btn sec" id="no" type="button">${_('Abbrechen')}</button></div>`); $('no').onclick = closeSheet; $('yes').onclick = () => { store.set(PREV, DATA); store.del(KEY); store.del(REC); DATA = null; IDX = null; closeSheet(); render(); }; };
}

/* ---------- Beispieldaten (erfundene Namen) ---------- */
function loadDemo() {
  let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const periods = [['8:10', '8:55'], ['8:55', '9:40'], ['10:00', '10:45'], ['10:45', '11:30'], ['11:45', '12:30'], ['12:30', '13:15'], ['13:15', '14:00'], ['14:00', '14:45'], ['14:45', '15:30']].map((p, i) => ({ n: i + 1, from: p[0], to: p[1] }));
  const subj = [['D', 4, 'Muster'], ['M', 4, 'Winter'], ['E', 4, 'Beispiel'], ['I', 3, 'Rossi'], ['Mu', 2, 'Sommer'], ['Ku', 2, 'Lindner'], ['Sp', 3, 'Falk'], ['G', 2, 'Berger'], ['B', 2, 'Roth'], ['Ph', 2, 'Kaiser']];
  const teachers = {}, classes = {}, tbusy = {}; const cn = ['5A', '5B', '6A', '7B', '8A', '9F', '10C', '11D'];
  const rooms = { D: '101', M: '102', E: '103', I: '104', Mu: '027', Ku: '215', Sp: 'Sp1', G: '105', B: '103E', Ph: '201' };
  subj.forEach(s => { teachers[s[2]] = { homeroom: '', lessons: [] }; });
  cn.forEach((c, ci) => {
    const cb = {}; classes[c] = { leader: subj[ci % subj.length][2], deputy: subj[(ci + 3) % subj.length][2], lessons: [] }; teachers[classes[c].leader].homeroom = teachers[classes[c].leader].homeroom || c;
    subj.forEach(s => { let need = s[1], tries = 0; while (need > 0 && tries++ < 400) {
      const dbl = need >= 2 && rnd() < .5, d = Math.floor(rnd() * 5), p = 1 + Math.floor(rnd() * 6), len = dbl ? 2 : 1, ok = [...Array(len)].every((_, k) => !cb[d + ',' + (p + k)] && !tbusy[s[2] + d + ',' + (p + k)] && p + k <= 8 && !(p + k === 3 && false));
      if (!ok) continue; for (let k = 0; k < len; k++) { cb[d + ',' + (p + k)] = 1; tbusy[s[2] + d + ',' + (p + k)] = 1; }
      const l = { d, p0: p, p1: p + len - 1, fach: s[0], room: rooms[s[0]] }; classes[c].lessons.push({ ...l, teacher: s[2] }); teachers[s[2]].lessons.push({ ...l, cls: c }); need -= len; } });
  });
  DATA = { v: 1, demo: true, year: '2026/2027', valid: '14.9.2026', stamp: _('Beispieldaten'), periods, teachers, classes, importedAt: Date.now(), files: [] };
  persist(); IDX = buildIndex(DATA); S = { tab: 't', q: '', sel: null, mode: 'now', d: 0, p: 1 }; render();
}

function embTheme() { if (!EMB) return; try { document.documentElement.dataset.skin = parent.document.documentElement.dataset.skin || ''; const P = parent.document.documentElement, cs = parent.getComputedStyle(P), r = document.documentElement, map = { '--blue': '--blue', '--bg': '--canvas', '--solid': '--glass-solid', '--tx': '--label', '--tx2': '--label-2', '--glass': '--glass', '--fill': '--fill', '--line': '--hair', '--onb': '--on-accent' };
  Object.keys(map).forEach(k => { const v = cs.getPropertyValue(map[k]).trim(); if (v) r.style.setProperty(k, v); }); r.style.setProperty('--blue-t', 'color-mix(in srgb,var(--blue) 14%,transparent)'); const dk = P.dataset.theme === 'dark' || (P.dataset.theme !== 'light' && parent.matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dk ? 'dark' : 'light'; r.style.colorScheme = dk ? 'dark' : 'light'; try { parent.document.getElementById('stFrame').style.colorScheme = dk ? 'dark' : 'light'; } catch (e) {} r.style.background = document.body.style.background = 'var(--bg)'; document.body.classList.add('emb'); const ff = parent.getComputedStyle(parent.document.body).fontFamily; if (ff) document.body.style.fontFamily = ff; } catch (e) {} }
embTheme(); window._orTheme = embTheme;
