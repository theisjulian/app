# OVMG · hält das kostenlose Supabase-Projekt „ovmg website wahl“ wach (es pausiert sonst nach etwa 7 Tagen ohne Nutzung).
# Ruft alle 3 Tage die harmlose Funktion ovmg_ping auf. Sie liest und ändert keine Daten.
# Der Schlüssel ist der öffentliche Publishable Key; die Daten schützen die Zugriffsregeln (RLS) der Datenbank.
name: ovmg wach halten
on:
  schedule:
    - cron: '41 5 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          out=$(curl -fsS --retry 3 --retry-delay 20 -X POST "https://ocaepkslxqjnyknslicc.supabase.co/rest/v1/rpc/ovmg_ping" \
            -H "apikey: sb_publishable_Vq4ojxY2PVXcLHSTpOMD6g_43ZgqpZA" \
            -H "Content-Type: application/json" -d '{}')
          echo "Antwort: $out"
          test "$out" = '"ok"'
