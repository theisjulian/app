# ’namo · hält das kostenlose Supabase-Projekt wach (es pausiert sonst nach etwa 7 Tagen ohne Nutzung).
# Ruft alle 3 Tage die harmlose Funktion andiamo_ping auf. Sie liest und ändert keine Daten.
# Ablegen unter: .github/workflows/namo-wachhalten.yml
name: namo wach halten
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          out=$(curl -fsS -X POST "https://ipkiijqypkhhqaraphty.supabase.co/rest/v1/rpc/andiamo_ping" \
            -H "apikey: sb_publishable_i_STyE3bdiLvWdWf0qGb2A_mDuC81pg" \
            -H "Content-Type: application/json" -d '{}')
          echo "Antwort: $out"
          test "$out" = '"ok"'
