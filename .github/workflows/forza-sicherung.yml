# forza · nächtliche Sicherung. Gehört in ein PRIVATES Repository: .github/workflows/forza-sicherung.yml
# Der Abzug wird mit "age" verschlüsselt abgelegt. Der Zugriff auf die Datenbank hält das kostenlose Supabase-Projekt wach.
# Schlägt der Lauf fehl, schickt GitHub automatisch eine E-Mail.
name: forza Sicherung
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge installieren
        run: |
          # Supabase läuft auf PostgreSQL 17; pg_dump muss mindestens diese Version haben
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17 age
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Datenbank sichern und verschlüsseln
        env:
          DB_URL: ${{ secrets.FORZA_DB_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.FORZA_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p backups
          f="backups/forza-$(date -u +%Y-%m-%d).sql.age"
          PGD=/usr/lib/postgresql/17/bin/pg_dump
          { $PGD "$DB_URL" --no-owner --no-privileges --schema=public
            $PGD "$DB_URL" --no-owner --no-privileges --data-only --table=auth.users; } | age -r "$AGE_PUBLIC_KEY" > "$f"
          test -s "$f"
          echo "Sicherung: $(wc -c < "$f") Bytes"
      - name: Alte Sicherungen aufräumen (30 Tage plus je Monat die erste)
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          for f in backups/forza-*.sql.age; do
            d=${f#backups/forza-}; d=${d%.sql.age}
            if [[ "$d" < "$cutoff" && "${d:8:2}" != "01" ]]; then git rm -q "$f"; fi
          done || true
      - name: Ablegen
        run: |
          git config user.name "forza-sicherung"
          git config user.email "actions@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "forza Sicherung $(date -u +%Y-%m-%d)"
          git push
