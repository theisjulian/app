  // ---------- 3 Kursplanung ----------
  function vKurse(v) {
    const { idx } = C();
    const off = offeredIds();
    const dem = ENGINE.demand(P);
    const gA = P.students.filter(s => !s.lf);
    const N = gA.length, Nw = gA.filter(s => s.g === 'w').length, Nm = gA.filter(s => s.g === 'm').length, Nd = N - Nw - Nm;
    off.forEach(id => { P.grid[id] = P.grid[id] || {}; HJ.forEach(h => { P.grid[id][h] = P.grid[id][h] || {}; }); });
    const seat = HJ.map(() => ({ all: 0, w: 0, m: 0, n: 0 }));
    const rows = off.map(id => {
      const s = idx[id]; const e = dem[id] || { total: 0, w: 0, m: 0, d: 0, alt: 0 };
      const split = ENGINE.isSplit(P, id); const cap = ENGINE.capOf(P, id);
      let courses = 0;
      const cells = HJ.map((h, i) => {
        const c = P.grid[id][h];
        if (split) {
          const w = +c.w || 0, m = +c.m || 0; courses += w + m;
          seat[i].all += (w + m) * cap; seat[i].w += w * cap; seat[i].m += m * cap; seat[i].n += w + m;
          return `<td><div class="cell"><label for="g-${id}-${i}-w">w</label><input type="number" min="0" max="9" id="g-${id}-${i}-w" data-id="${id}" data-h="${h}" data-k="w" value="${w}"><label for="g-${id}-${i}-m">m</label><input type="number" min="0" max="9" id="g-${id}-${i}-m" data-id="${id}" data-h="${h}" data-k="m" value="${m}"></div></td>`;
        }
        const n = +c.n || 0; courses += n;
        seat[i].all += n * cap; seat[i].n += n;
        return `<td><div class="cell"><input type="number" min="0" max="9" id="g-${id}-${i}" data-id="${id}" data-h="${h}" data-k="n" value="${n}" aria-label="${esc(s.name)} ${h} Kurse"></div></td>`;
      }).join('');
      const seatsSport = courses * cap;
      const cover = e.total ? seatsSport / e.total : null;
      const pill = !e.total ? (courses ? '<span class="pill info">ohne Wünsche</span>' : '') : cover >= 1 ? '<span class="pill ok">reicht</span>' : cover >= .85 ? '<span class="pill warn">knapp</span>' : '<span class="pill bad">zu wenig</span>';
      return `<tr><td><span class="gdot" style="background:var(--g${s.group})"></span>${esc(s.name)}${split ? ' <span class="small muted">(getrennt)</span>' : ''}</td>
        <td class="num"><b>${e.total}</b></td><td class="num small">${e.w}/${e.m}${e.d ? '/' + e.d : ''}</td><td class="num small">${e.alt}</td>
        ${cells}<td class="num">${courses} × ${cap}</td><td>${pill}</td></tr>`;
    }).join('');
    const foot = HJ.map((h, i) => {
      const s = seat[i];
      const lack = [];
      if (s.all < N) lack.push(`${N - s.all} Plätze fehlen`);
      const mixed = s.all - s.w - s.m;
      if (s.w + mixed < Nw) lack.push('zu wenig Plätze für Schülerinnen');
      if (s.m + mixed < Nm) lack.push('zu wenig Plätze für Schüler');
      return `<td class="c"><div><b>${s.n}</b> Kurse · ${s.all} Plätze</div>${lack.length ? `<span class="pill bad">${lack.join(', ')}</span>` : '<span class="pill ok">reicht</span>'}</td>`;
    }).join('');
    const lfCands = off.filter(id => P.sports[id].lf);
    const lfRows = P.lfGroups.map((gr, gi) => {
      const val = ENGINE.lfGroupValid(P, gr);
      const n = P.students.filter(s => s.lf).length;
      return `<div class="panel" style="background:var(--bg)" data-gi="${gi}">
        <div class="row">
          <label class="field" style="flex:1;min-width:180px">Name<input type="text" data-lk="name" value="${esc(gr.name)}"></label>
          <label class="field">Größe<input type="number" min="4" max="40" data-lk="cap" value="${gr.cap}"></label>
          <button class="btn quiet" type="button" data-lrm="${gi}" style="align-self:flex-end">Entfernen</button>
        </div>
        <div class="row">${HJ.map(h => `<label class="field">${h}<select data-lh="${h}"><option value="">–</option>${lfCands.map(id => `<option value="${id}" ${gr.sports[h] === id ? 'selected' : ''}>${esc(idx[id].name)}</option>`).join('')}</select></label>`).join('')}</div>
        <div>${val.ok ? '<span class="pill ok">regelkonform</span>' : `<span class="pill bad">${esc(val.checks.filter(c => !c.ok).map(c => c.label).join('; '))}</span>`} <span class="small muted">${n} Schüler mit Leistungsfach</span></div>
      </div>`;
    }).join('');
    v.innerHTML = `<div class="stack">
      <div class="stats">
        <div class="stat"><b>${N}</b><span>Schüler im Fach Sport (gA): ${Nw} w, ${Nm} m${Nd ? ', ' + Nd + ' d' : ''}</span></div>
        <div class="stat"><b>${N * 4}</b><span>Belegungen über vier Halbjahre</span></div>
        <div class="stat"><b>${N}</b><span>Plätze nötig pro Halbjahr</span></div>
        <div class="stat"><b>${P.students.filter(s => s.lf).length}</b><span>Schüler im Leistungsfach</span></div>
      </div>
      <section class="panel">
        <div class="row" style="justify-content:space-between">
          <div><h2>Kursangebot je Halbjahr</h2><p class="muted small">Anzahl Kurse pro Sportart und Halbjahr. „Wünsche“ zählt gewählte Halbjahre (w/m/d), „Ersatz“ die Nennungen als Ersatzwunsch.</p></div>
          <button class="btn ghost" type="button" id="k-prop" ${N ? '' : 'disabled'}>Kursangebot vorschlagen</button>
        </div>
        ${off.length ? `<div class="tbl-wrap"><table class="grid-in">
          <thead><tr><th>Sportart</th><th class="num">Wünsche</th><th class="num">w/m</th><th class="num">Ersatz</th>${HJ.map(h => `<th class="c">${h}</th>`).join('')}<th class="num">Plätze</th><th></th></tr></thead>
          <tbody id="k-body">${rows}</tbody>
          <tfoot><tr><td colspan="4"><b>Summe je Halbjahr</b><div class="small muted">nötig: ${N} Plätze</div></td>${foot}<td colspan="2"></td></tr></tfoot>
        </table></div>` : '<p class="muted">Zuerst im Reiter 1 Sportarten anbieten.</p>'}
        <p class="small muted">Tipp: Wer eine Sportart zweimal wählt, braucht sie in zwei verschiedenen Halbjahren. Sportarten mit vielen Doppelwahlen deshalb auf mindestens zwei Halbjahre verteilen.</p>
      </section>
      <section class="panel">
        <div class="row" style="justify-content:space-between">
          <div><h2>Leistungsfach-Kursgruppen</h2><p class="muted small">Theorie und Praxis laufen grundsätzlich in einer Kursgruppe: zwei Sportarten aus verschiedenen Gruppen, je zwei Halbjahre.</p></div>
          <button class="btn quiet" type="button" id="lf-add">Kursgruppe hinzufügen</button>
        </div>
        ${lfRows || '<p class="muted">Keine Leistungsfach-Kursgruppe angelegt.</p>'}
      </section></div>`;
    const kb = $('k-body');
    if (kb) kb.addEventListener('change', e => {
      const t = e.target; if (!t.dataset.id) return;
      P.grid[t.dataset.id][t.dataset.h][t.dataset.k] = Math.max(0, Math.min(9, +t.value || 0));
      save(); const id = t.id; render(); const el = $(id); if (el) el.focus();
    });
    const pb = $('k-prop');
    if (pb) pb.onclick = () => confirmInline(pb, 'Das bisherige Kursangebot wird ersetzt.', 'Vorschlag übernehmen', () => {
      P.grid = ENGINE.proposeGrid(P); save(); render(); toast('Vorschlag erstellt. Jetzt an Hallen und Lehrkräfte anpassen.');
    });
    $('lf-add').onclick = () => {
      let n = 1; while (P.lfGroups.some(g => g.id === 'g' + n)) n++;
      P.lfGroups.push({ id: 'g' + n, name: 'Leistungsfach Sport' + (P.lfGroups.length ? ' ' + (P.lfGroups.length + 1) : ''), cap: 24, sports: {} });
      save(); render();
    };
    v.querySelectorAll('[data-gi]').forEach(box => {
      const gr = P.lfGroups[+box.dataset.gi];
      box.addEventListener('change', e => {
        const t = e.target;
        if (t.dataset.lk === 'name') gr.name = t.value.trim() || 'Leistungsfach Sport';
        if (t.dataset.lk === 'cap') gr.cap = Math.max(4, Math.min(40, +t.value || 24));
        if (t.dataset.lh) gr.sports[t.dataset.lh] = t.value;
        save(); render();
      });
    });
    v.querySelectorAll('[data-lrm]').forEach(b => b.onclick = () => { P.lfGroups.splice(+b.dataset.lrm, 1); save(); render(); });
  }

  // ---------- 4 Verteilung ----------
  function courseState() {
    const courses = ENGINE.buildCourses(P);
    const byId = {}; courses.forEach(c => { byId[c.id] = c; c.members = []; });
    P.students.forEach(st => { const a = P.assignment[st.id] || {}; HJ.forEach(h => { if (a[h] && byId[a[h]]) byId[a[h]].members.push(st); }); });
    return { courses, byId };
  }
  function vVerteilung(v) {
    const { idx } = C();
    const { courses, byId } = courseState();
    const stat = {}; let hits = 0, full = 0, incomplete = 0, broken = 0;
    P.students.forEach(st => {
      const s = ENGINE.studentStatus(P, st, byId, idx); stat[st.id] = s;
      hits += s.hits; if (s.hits === 4) full++;
      if (!s.complete) incomplete++; else if (!s.ruleOk) broken++;
    });
    const over = courses.filter(c => c.members.length > c.cap);
    const n = P.students.length;
    const pct = n ? Math.round(hits / (4 * n) * 100) : 0;
    const assignedAny = P.students.some(st => Object.keys(P.assignment[st.id] || {}).length);
    const nLocked = Object.values(P.locks).filter(Boolean).length;
    v.innerHTML = `<div class="stack">
      <section class="panel">
        <div class="row" style="justify-content:space-between">
          <div><h2>Verteilung</h2><p class="muted small">Verteilt alle Schüler regelkonform auf die Kurse aus Reiter 3, möglichst nach Erstwunsch, sonst nach Ersatzwunsch. ${nLocked ? `${nLocked} fixierte Schüler bleiben, wo sie sind.` : ''}</p></div>
          <div class="row">
            ${nLocked ? '<button class="btn quiet" type="button" id="v-unlock">Alle Fixierungen lösen</button>' : ''}
            <button class="btn" type="button" id="v-run" ${n && courses.length ? '' : 'disabled'}>Automatisch verteilen</button>
          </div>
        </div>
        ${lastRun ? `<p class="small muted">Letzte Verteilung: ${lastRun.runs} Durchläufe geprüft, beste Lösung übernommen.</p>` : ''}
      </section>
      ${assignedAny ? `<div class="stats">
        <div class="stat ${pct >= 85 ? 'ok' : ''}"><b>${pct} %</b><span>der Wünsche erfüllt</span></div>
        <div class="stat"><b>${full}</b><span>von ${n} bekommen alle vier Wünsche</span></div>
        <div class="stat ${incomplete ? 'bad' : 'ok'}"><b>${incomplete}</b><span>ohne vollständigen Platz</span></div>
        <div class="stat ${broken + over.length ? 'bad' : 'ok'}"><b>${broken + over.length}</b><span>Regelverstöße und überfüllte Kurse</span></div>
      </div>
      ${incomplete ? `<div class="banner" style="background:var(--badbg);border-color:var(--bad)"><span><b>${incomplete} Schüler ohne vollständigen Platz.</b> Meist fehlen Plätze in einem Halbjahr oder die passende Leistungsfach-Kursgruppe. Kurse in Reiter 3 ergänzen und neu verteilen, oder unten von Hand zuteilen.</span></div>` : ''}
      <div class="row" style="justify-content:space-between">
        <div class="subtabs" role="group" aria-label="Ansicht">
          <button type="button" data-sub="schueler" aria-pressed="${sub === 'schueler'}">Schülerübersicht</button>
          <button type="button" data-sub="kurse" aria-pressed="${sub === 'kurse'}">Kurslisten</button>
        </div>
        ${sub === 'schueler' ? `<div class="row"><input type="text" id="v-q" placeholder="Name oder Klasse suchen" value="${esc(filter.q)}" style="width:220px" aria-label="Suchen"><label class="row small" style="gap:6px"><input type="checkbox" id="v-only" ${filter.only ? 'checked' : ''}> nur Abweichungen</label></div>` : ''}
      </div>
      <div id="v-sub"></div>` : `<section class="panel"><p class="muted">Noch keine Verteilung. Erst Wahlen einlesen (Reiter 2) und Kurse planen (Reiter 3), dann „Automatisch verteilen“.</p></section>`}
    </div>`;
    const run = $('v-run');
    if (run) run.onclick = () => {
      run.disabled = true; run.textContent = 'Verteile …';
      setTimeout(() => {
        const r = ENGINE.distribute(P, { budgetMs: 1500 });
        P.assignment = r.assignment; lastRun = r; save(); render();
        toast(r.unassigned.length ? `${r.unassigned.length} Schüler ohne vollständigen Platz. Kurse ergänzen oder von Hand zuteilen.` : 'Alle verteilt.');
      }, 30);
    };
    const ul = $('v-unlock'); if (ul) ul.onclick = () => { P.locks = {}; save(); render(); };
    v.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { sub = b.dataset.sub; render(); });
    if (!assignedAny) return;
    if (sub === 'schueler') renderStudents($('v-sub'), courses, byId, stat);
    else renderCourseLists($('v-sub'), courses);
    const q = $('v-q');
    if (q) q.addEventListener('input', e => { filter.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('v-q'); i.focus(); i.setSelectionRange(pos, pos); });
    const only = $('v-only'); if (only) only.onchange = e => { filter.only = e.target.checked; render(); };
  }
  function renderStudents(box, courses, byId, stat) {
    const { idx } = C();
    const q = filter.q.toLowerCase();
    const list = P.students.filter(st => {
      if (q && !(st.name + ' ' + st.klasse).toLowerCase().includes(q)) return false;
      if (filter.only) { const s = stat[st.id]; if (s.complete && s.ruleOk && s.hits === 4) return false; }
      return true;
    }).sort((a, b) => a.name.localeCompare(b.name, 'de'));
    const opts = {};
    HJ.forEach(h => { opts[h] = courses.filter(c => c.hj === h); });
    const rows = list.map(st => {
      const s = stat[st.id]; const a = P.assignment[st.id] || {};
      const wishLeft = SPW.countBy(st.wishes, x => x);
      const cells = HJ.map(h => {
        const cur = a[h] || '';
        const pool = opts[h].filter(c => st.lf ? c.lf : (!c.lf && ENGINE.compat(c, st.g)));
        const cc = byId[cur];
        let cls = '';
        if (!cc) cls = 'miss';
        else if (wishLeft[cc.sport] > 0) wishLeft[cc.sport]--; else cls = 'alt';
        return `<td><select data-st="${st.id}" data-h="${h}" class="${cls}" aria-label="${esc(st.name)} ${h}"><option value="">– kein Kurs –</option>${pool.map(c => `<option value="${c.id}" ${c.id === cur ? 'selected' : ''}>${esc(c.label)} (${c.members.length}/${c.cap})</option>`).join('')}</select></td>`;
      }).join('');
      let status;
      if (!s.complete) status = '<span class="pill bad">unvollständig</span>';
      else if (!s.ruleOk) status = `<span class="pill bad" title="${esc(s.checks.filter(c => !c.ok).map(c => c.label).join('; '))}">Regel verletzt</span>`;
      else status = `<span class="pill ${s.hits === 4 ? 'ok' : 'warn'}">${s.hits}/4 Wünsche</span>`;
      return `<tr><td>${esc(st.name)}${st.lf ? ' <span class="pill info">LF</span>' : ''}<div class="small muted">${esc(st.klasse)} · ${gLabel(st.g)}</div></td>
        <td>${chips(st.wishes)}${(st.alt || []).length ? `<div class="small muted" style="margin-top:3px">Ersatz: ${st.alt.map(x => idx[x] ? idx[x].name : x).join(', ')}</div>` : ''}</td>
        ${cells}<td>${status}</td>
        <td class="c"><input type="checkbox" data-lock="${st.id}" ${P.locks[st.id] ? 'checked' : ''} title="Fixiert: bleibt bei neuer Verteilung" aria-label="${esc(st.name)} fixieren"></td></tr>`;
    }).join('');
    box.innerHTML = `<div class="tbl-wrap" style="max-height:75vh"><table>
      <thead><tr><th>Name</th><th>Wünsche</th>${HJ.map(h => `<th>${h}</th>`).join('')}<th>Status</th><th class="c" title="Fixiert">Fix</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="8" class="muted">Keine Treffer.</td></tr>'}</tbody></table></div>
      <p class="small muted">Gelb umrandet: Kurs entspricht keinem Erstwunsch. Rot: kein Kurs. Wer von Hand umgesetzt wird, ist automatisch fixiert.</p>`;
    box.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.st) {
        const a = P.assignment[t.dataset.st] = P.assignment[t.dataset.st] || {};
        if (t.value) a[t.dataset.h] = t.value; else delete a[t.dataset.h];
        P.locks[t.dataset.st] = true; save(); render();
      } else if (t.dataset.lock) { P.locks[t.dataset.lock] = t.checked; save(); }
    });
  }
  function renderCourseLists(box, courses) {
    box.innerHTML = HJ.map(h => {
      const cs = courses.filter(c => c.hj === h);
      const n = cs.reduce((a, c) => a + c.members.length, 0);
      return `<section class="panel"><div class="hj-title"><h3>Halbjahr ${h}</h3><span class="muted small">${cs.length} Kurse · ${n} Schüler</span></div>
        <div class="courses">${cs.map(c => {
          const m = c.members.slice().sort((a, b) => a.name.localeCompare(b.name, 'de'));
          const over = m.length > c.cap;
          return `<div class="course ${over ? 'over' : ''}">
            <div class="row" style="justify-content:space-between;gap:6px"><h4>${esc(c.label)}</h4><span class="small ${over ? '' : 'muted'}" style="${over ? 'color:var(--bad);font-weight:600' : ''}">${m.length}/${c.cap}</span></div>
            <div class="bar"><i style="width:${Math.min(100, m.length / c.cap * 100)}%"></i></div>
            <input type="text" data-cm="${c.id}" value="${esc((P.courseMeta[c.id] || {}).teacher || '')}" placeholder="Lehrkraft" aria-label="Lehrkraft ${esc(c.label)} ${h}">
            ${m.length ? `<ol>${m.map(s => `<li>${esc(s.name)} <span class="muted small">${esc(s.klasse)}</span></li>`).join('')}</ol>` : '<span class="muted small">leer</span>'}
          </div>`;
        }).join('')}</div></section>`;
    }).join('');
    box.addEventListener('change', e => {
      const t = e.target; if (!t.dataset.cm) return;
      P.courseMeta[t.dataset.cm] = { ...(P.courseMeta[t.dataset.cm] || {}), teacher: t.value.trim() }; save();
    });
  }

  // ---------- 5 Export ----------
  function vExport(v) {
    v.innerHTML = `<div class="cols">
      <section class="panel">
        <h2>Listen</h2>
        <p class="muted">CSV-Dateien öffnen sich direkt in Excel (Semikolon-getrennt, Umlaute korrekt).</p>
        <div class="row"><button class="btn" type="button" id="x-students">Schülerübersicht (CSV)</button></div>
        <div class="row"><button class="btn" type="button" id="x-courses">Kurslisten (CSV)</button></div>
        <div class="row"><button class="btn ghost" type="button" id="x-print">Kurslisten drucken</button></div>
      </section>
      <section class="panel">
        <h2>Projekt</h2>
        <p class="muted">Das Projekt enthält Angebot, Wahlen, Kursplanung und Verteilung. Die Datei kann die Oberstufenkoordination hier mit „Projekt öffnen“ laden und weiterbearbeiten.</p>
        <div class="row"><button class="btn" type="button" id="x-save">Projekt speichern</button><button class="btn quiet" type="button" id="x-open">Projekt öffnen</button></div>
        <p class="small muted">Zwischendurch speichert das Tool automatisch in diesem Browser. Die Projektdatei ist die Sicherung und der Weg zu Kollegen. Sie enthält Schülernamen, also nur dienstlich weitergeben.</p>
      </section></div>`;
    $('x-students').onclick = () => {
      const { idx } = C(); const { byId } = courseState();
      const rows = [['Name', 'Klasse', 'Geschlecht', 'Art', ...HJ, 'Wünsche', 'Erfüllte Wünsche', 'Hinweis']];
      P.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'de')).forEach(st => {
        const s = ENGINE.studentStatus(P, st, byId, idx); const a = P.assignment[st.id] || {};
        rows.push([st.name, st.klasse, st.g, st.lf ? 'Leistungsfach' : 'gA', ...HJ.map(h => byId[a[h]] ? byId[a[h]].label : ''),
          st.wishes.map(w => idx[w] ? idx[w].name : w).join(', '), s.hits + '/4', !s.complete ? 'unvollständig' : (!s.ruleOk ? 'Regel verletzt' : '')]);
      });
      download(`Sportwahl-Schueler-${slug(P.meta.jahrgang)}.csv`, csv(rows), 'text/csv;charset=utf-8');
    };
    $('x-courses').onclick = () => {
      const { courses } = courseState();
      const rows = [['Halbjahr', 'Kurs', 'Lehrkraft', 'Name', 'Klasse', 'Geschlecht']];
      courses.forEach(c => c.members.slice().sort((a, b) => a.name.localeCompare(b.name, 'de')).forEach(s => rows.push([c.hj, c.label, (P.courseMeta[c.id] || {}).teacher || '', s.name, s.klasse, s.g])));
      download(`Sportwahl-Kurslisten-${slug(P.meta.jahrgang)}.csv`, csv(rows), 'text/csv;charset=utf-8');
    };
    $('x-print').onclick = () => {
      const { courses } = courseState();
      $('print-area').innerHTML = HJ.map(h => `<section><h2>Sport ${h} · ${esc(P.meta.jahrgang)}</h2><div class="pcs">${courses.filter(c => c.hj === h).map(c => `<div class="pc"><h3>${esc(c.label)} (${c.members.length})</h3><div>${esc((P.courseMeta[c.id] || {}).teacher || '')}</div><ol>${c.members.slice().sort((a, b) => a.name.localeCompare(b.name, 'de')).map(s => `<li>${esc(s.name)}, ${esc(s.klasse)}</li>`).join('')}</ol></div>`).join('')}</div></section>`).join('');
      window.print();
    };
    $('x-save').onclick = () => { const p = { ...P, example: P.example }; download(`Sportwahl-Projekt-${slug(P.meta.jahrgang)}.json`, JSON.stringify(p, null, 1), 'application/json'); };
    $('x-open').onclick = () => $('file-project').click();
  }
  $('file-project').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { const p = JSON.parse(rd.result); if (!p || p.version !== 1) throw 0; P = normalize(p); save(); go('verteilung'); toast('Projekt geladen.'); }
      catch (err) { toast('Diese Datei ist kein Sportwahl-Projekt.'); }
    };
    rd.readAsText(f, 'utf-8'); e.target.value = '';
  });

  // ---------- Start ----------
  P = load();
  let t0 = 'start';
  try { t0 = localStorage.getItem(KEY + '-tab') || 'start'; } catch (e) { }
  renderHead();
  go(['start', 'angebot', 'wahlen', 'kurse', 'verteilung', 'export'].includes(t0) ? t0 : 'start');
})();
</script>
</body>
</html>
